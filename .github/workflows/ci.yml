name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-24.04
    container: python:3.12-slim-trixie   # same base as the Dockerfile: Debian 13, ffmpeg 7.1
    timeout-minutes: 20
    steps:
      - name: Install ffmpeg, git and node
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg git nodejs ca-certificates
          ffmpeg -version | head -1
          python3 --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Deny-scan (shipped tree, the existing test)
        run: python3 -m unittest -v tests.test_portability
      - name: Deny-scan (every tracked file)
        run: |
          python3 - <<'PY'
          import subprocess, sys
          from tests.test_portability import scan
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          hits = scan(files)
          print("\n".join(hits) or f"deny-scan clean: {len(files)} tracked files")
          sys.exit(1 if hits else 0)
          PY
      - name: No media or model weights in git
        run: |
          if git ls-files | grep -Ei '\.(png|jpe?g|webp|gif|heic|mp4|mov|webm|mkv|mp3|wav|m4a|flac|ogg|aac|pdf|safetensors|gguf|ckpt|pt|pth|bin|onnx)$'; then
            echo "media or weights are tracked; host them outside git"; exit 1
          fi
      - name: Compile
        run: python3 -m py_compile app.py medialab/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
